<body>
<header class="topbar">
  <a class="brand" href="#" aria-label="AI Bone Studio 首页"><span class="brand-mark">✦</span><span><strong>AI Bone Studio</strong><small>角色动画工坊 <em>0.2</em></small></span></a>
  <label class="name-label"><span>当前工程</span><input id="project-name" maxlength="80" aria-label="工程名称" value="my-character"></label>
  <div class="header-actions"><button id="new">新建</button><button id="open">打开工程</button><button id="save">保存工程</button><button id="go-export" class="primary">导出资源 ↗</button></div>
</header>
<nav class="steps" aria-label="制作流程">
  <button data-mode="assemble" class="active"><b>1</b><span>拼装角色<small>把零件放到合适的位置</small></span></button>
  <button data-mode="rig"><b>2</b><span>连接关节<small>让零件跟着骨骼走</small></span></button>
  <button data-mode="animate"><b>3</b><span>制作动作<small>摆姿势，自动记住</small></span></button>
  <button data-mode="export"><b>4</b><span>导出到游戏<small>Laya / Cocos · Spine 3.8</small></span></button>
</nav>
<div id="resume" class="resume" hidden><span>发现上次保存在此浏览器的工程。</span><button id="restore">恢复上次工程</button><button id="dismiss-resume">忽略</button></div>
<nav class="mobile-tabs" aria-label="切换面板"><button data-pane="library">部件 / 关节</button><button data-pane="canvas" class="active">画板</button><button data-pane="inspector">属性 / 导出</button></nav>
<div id="studio" class="studio" data-pane="canvas">
  <aside class="library panel">
    <div class="panel-heading"><h2>我的零件</h2><span id="part-count" class="badge">0</span></div>
    <button id="import" class="import-button">＋ 导入 PNG / 部件 ZIP</button><p class="micro">支持多选、拖入；图片只在本机处理。</p>
    <div id="parts-list" class="parts-list"></div>
    <div class="panel-heading bone-heading"><h2>关节树</h2><button id="clear-selection" title="选择整体根关节">选根</button></div>
    <div id="bones-list" class="bones-list"></div>
    <button id="demo" class="demo-button"><span>✧</span><span>还没有素材？<strong>打开会挥手的练习角色 →</strong></span></button>
  </aside>
  <main class="workspace">
    <div class="canvas-toolbar"><div class="tools"><button id="select-tool" class="selected" title="选择和拖动">↖ 选择</button><button id="draw-tool" title="依次点击肩、肘、腕；Esc 结束">⌁ 画关节链</button><button id="bind-tool">⊕ 绑定零件</button></div><div class="tools"><button id="undo" title="撤销 Ctrl/Cmd+Z">↶</button><button id="redo" title="重做 Ctrl/Cmd+Shift+Z">↷</button><button id="fit">适合画板</button><select id="zoom" aria-label="画板缩放"><option value="0.35">35%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option></select></div></div>
    <div id="mode-hint" class="mode-hint"></div>
    <div id="canvas-scroll" class="canvas-scroll"><div class="canvas-wrap"><canvas id="board" width="800" height="720" tabindex="0" role="img" aria-label="角色拼装与骨骼编辑画板。也可通过右侧数字属性精确调整。"></canvas></div><div id="empty-state" class="empty-state"><span class="empty-star">✦</span><h1>让你的角色，动起来。</h1><p>先导入拆好的透明 PNG，或打开练习角色。<br>不用认识复杂术语，跟着上面四步走。</p><button id="empty-import" class="primary">导入我的零件</button><button id="empty-demo">先试一试练习角色</button></div></div>
    <section id="timeline" class="timeline" hidden>
      <div class="timeline-top"><button id="play" class="play">▶ 播放</button><label>动作 <select id="clip" aria-label="选择动作"></select></label><button id="add-clip" title="新建动作">＋</button><button id="delete-clip" title="删除当前动作">删除动作</button><label class="duration-label">时长 <input id="duration" type="number" min="0.1" max="60" step="0.1" value="2"> 秒</label><span class="auto-key">● 自动记帧</span></div>
      <div class="time-row"><span id="time-label">0.00 s</span><input id="time" type="range" min="0" max="2" step="0.0333333333" value="0" aria-label="动画时间"><span id="time-end">2.00 s</span></div>
      <div id="keys" class="keys" aria-label="当前关节关键帧"></div>
      <div class="timeline-bottom"><span id="track-label">选择关节后，转动它就会记住姿势。</span><button id="add-key">记住此刻姿势</button><button id="delete-key">删除此帧</button></div>
    </section>
  </main>
  <aside class="inspector panel"><div class="panel-heading"><h2 id="inspector-title">操作向导</h2><span class="badge">✦</span></div><div id="properties"></div></aside>
</div>
<footer><span id="status" role="status" aria-live="polite">准备就绪 · 支持鼠标与单指拖动</span><span class="footer-right">本地自动保存 ≠ 下载备份 <b id="save-state">尚未修改</b></span></footer>
<div id="toast" class="toast" role="alert" hidden></div>
<input id="image-input" type="file" accept="image/png,image/webp,.zip" multiple hidden><input id="project-input" type="file" accept=".json,.zip" hidden>
