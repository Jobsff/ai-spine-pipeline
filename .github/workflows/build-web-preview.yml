name: Build web preview
on:
  push:
    branches: [main]
    paths:
      - 'apps/editor/**'
      - 'apps/gateway/**'
      - '.github/workflows/build-web-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-web-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Build and test editor
        working-directory: apps/editor
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test
      - name: Test gateway without paid provider calls
        if: ${{ hashFiles('apps/gateway/package.json') != '' }}
        working-directory: apps/gateway
        run: npm test
      - name: Publish build branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          site=$(mktemp -d)
          cp apps/editor/dist/AI-Bone-Studio.html "$site/index.html"
          touch "$site/.nojekyll"
          VERSION=$(node -p "require('./apps/editor/package.json').version")
          printf '{"sourceCommit":"%s","editorVersion":"%s"}\n' "$SOURCE_SHA" "$VERSION" > "$site/version.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE=$(mktemp)
          rm "$GIT_INDEX_FILE"
          git read-tree --empty
          for name in index.html .nojekyll version.json; do
            blob=$(git hash-object -w "$site/$name")
            git update-index --add --cacheinfo 100644 "$blob" "$name"
          done
          tree=$(git write-tree)
          parent=()
          if git fetch origin site-build; then parent=(-p "$(git rev-parse FETCH_HEAD)"); fi
          commit=$(printf 'build: web preview from %s\n' "$SOURCE_SHA" | git commit-tree "$tree" "${parent[@]}")
          git push origin "$commit:refs/heads/site-build"
          echo "Site build commit: $commit"
